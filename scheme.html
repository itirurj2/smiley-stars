<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Стальные схемы</title>
<meta name="description" content="Редактор блок-схем на стальном листе: фигуры как в draw.io, стрелки, текст и анимация паяльником.">
<meta name="theme-color" content="#24282d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2380878e'/%3E%3Cpath d='M14 46h16V18h20' fill='none' stroke='%231d2126' stroke-width='5' stroke-linejoin='round'/%3E%3Ccircle cx='50' cy='18' r='7' fill='%23ff8a24'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Jura:wght@600;700&display=swap">
<style>
:root{
  /* Layout: a workbench. Graphite tool rails frame a brushed-steel plate where the scheme is soldered. */
  color-scheme:dark;
  --rail:#24282d;
  --rail-ctl:#30353b;
  --rail-hover:#3a4148;
  --line:#3d444c;
  --line-deep:#15181b;
  --field:#1b1e22;
  --ink:#e6e9ec;
  --ink-dim:#98a1aa;
  --select:#4cc2ff;
  --select-deep:#173a52;
  --hot:#ff8a24;
  --hot-deep:#e8590c;
  --warn:#ffc53d;
  --danger:#ff6b6b;
  --steel:#80878e;
  --font-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-brand:"Jura","Golos Text",system-ui,sans-serif;
  --font-scheme:Arial,"Liberation Sans","Helvetica Neue",Helvetica,sans-serif;
  --bar-h:52px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--rail);color:var(--ink);font:14px/1.4 var(--font-ui);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--select);outline-offset:1px}

#app{position:relative;height:100%;overflow:hidden;display:grid;grid-template-rows:var(--bar-h) minmax(0,1fr);grid-template-columns:244px minmax(0,1fr) 280px;grid-template-areas:"bar bar bar" "pal stage props"}

/* ---------- top bar ---------- */
#bar{grid-area:bar;display:flex;align-items:center;gap:6px;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(#2c3136,#23272b);border-bottom:1px solid var(--line-deep);box-shadow:inset 0 -1px 0 rgba(255,255,255,.04);min-width:0;z-index:40}
.brand{display:flex;align-items:center;gap:9px;font:700 13px/1 var(--font-brand);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;margin-right:8px;color:var(--ink)}
.brand svg{width:24px;height:24px;flex:none}
.btn{appearance:none;border:1px solid var(--line);background:var(--rail-ctl);height:34px;min-width:34px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:background .12s,border-color .12s}
.btn:hover{background:var(--rail-hover)}
.btn:disabled{opacity:.38;cursor:default;background:var(--rail-ctl)}
.btn[aria-pressed="true"]{border-color:var(--select);background:var(--select-deep);color:#fff}
.btn svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.icon{padding:0}
.btn.wide{width:100%}
.btn.danger{color:var(--danger)}
.btn-play{background:linear-gradient(180deg,#ffa24d,#e8590c);border-color:#ffbd85;color:#1d0e02;font-weight:600;padding:0 15px;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 18px rgba(255,138,36,.38),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-play:hover{background:linear-gradient(180deg,#ffb36b,#f26616)}
.btn-play svg{fill:currentColor;stroke:none}
.btn-play.on{background:linear-gradient(180deg,#5d656e,#3b4148);border-color:#6f7881;color:#fff;box-shadow:none}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px;flex:none}
.spacer{flex:1;min-width:4px}
#doc-title{height:34px;min-width:0;width:220px;border-radius:8px;border:1px solid transparent;background:transparent;padding:0 10px;color:var(--ink);font-weight:500}
#doc-title:hover{border-color:var(--line)}
#doc-title:focus{border-color:var(--select);background:var(--field);outline:none}
#speed{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--rail-ctl);padding:0 6px;font-size:13px}
.menu-wrap{position:relative}
.menu{position:absolute;left:0;top:calc(100% + 6px);min-width:250px;background:#2a2f34;border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.45);z-index:60;display:grid;gap:2px}
.menu button{appearance:none;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13.5px}
.menu button:hover{background:var(--rail-hover)}
.menu button svg{width:17px;height:17px;fill:none;stroke:var(--ink-dim);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.only-m{display:none!important}

/* ---------- palette ---------- */
#palette{grid-area:pal;background:var(--rail);border-right:1px solid var(--line-deep);display:flex;flex-direction:column;min-height:0;min-width:0;z-index:30}
.pal-top{padding:12px 14px 8px max(16px,env(safe-area-inset-left,0px))}
.pal-top input{width:100%;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--field);padding:0 11px;font-size:13px}
.pal-top input::placeholder{color:#6f7880}
#pal-scroll{overflow-y:auto;flex:1;min-height:0;padding:0 14px 20px max(16px,env(safe-area-inset-left,0px))}
.pal-cat h3{font:700 11px/1 var(--font-brand);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin:16px 0 9px}
.pal-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tile{appearance:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border-radius:9px;border:1px solid #33393f;background:#2a2f34;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y;color:var(--ink-dim);font-size:10.5px;line-height:1.15;text-align:center;min-width:0}
.tile:hover{border-color:#59636d;color:var(--ink);background:#30363c}
.tile svg{width:46px;height:31px;overflow:visible;flex:none;pointer-events:none}
.tile span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;pointer-events:none}
.tile[aria-pressed="true"]{border-color:var(--select);color:#fff;background:#203646}
.tile-text{grid-column:1/-1;flex-direction:row;justify-content:flex-start;gap:12px;padding:8px 12px;border-style:dashed;border-color:#59636d;background:transparent}
.tile-text span{display:block;font-size:12.5px;color:var(--ink);text-align:left}
.tile-text small{display:block;color:var(--ink-dim);font-size:11px;margin-top:2px}
.ti-fill{fill:rgba(255,255,255,.07);stroke:#c4cbd2;stroke-width:1.3;stroke-linejoin:round}
.ti-line{fill:none;stroke:#c4cbd2;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.ti-head{stroke:#c4cbd2;stroke-width:1.3;stroke-linejoin:round}
.pal-note{color:var(--ink-dim);font-size:11.5px;margin:9px 2px 0;line-height:1.4}
.ghost{position:fixed;left:0;top:0;width:62px;height:46px;border-radius:9px;border:1px solid var(--select);background:rgba(36,40,45,.92);display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:200;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.ghost svg{width:46px;height:31px;overflow:visible}

/* ---------- stage ---------- */
#stagewrap{grid-area:stage;position:relative;overflow:hidden;min-width:0;min-height:0;background:var(--steel)}
#bg,#fx,#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:4}
#stage{z-index:2;touch-action:none;user-select:none;-webkit-user-select:none}
#stage.space{cursor:grab}
#stage.grabbing{cursor:grabbing}
#stage.playing #L-shapes,#stage.playing #L-edges{visibility:hidden}
.shape{cursor:move}
.shape .hit{fill:transparent;pointer-events:all}
.edge{cursor:pointer}
.ehit{fill:none;stroke:transparent;pointer-events:stroke}
.o-sel,.o-hint,.o-esel,.o-target,.o-guide,.o-band{pointer-events:none}
.o-sel{fill:none;stroke:var(--select)}
.o-hint{fill:none;stroke:rgba(18,22,26,.6)}
.o-esel{fill:none;stroke:var(--select);opacity:.4;stroke-linecap:round;stroke-linejoin:round}
.o-handle{fill:#fff;stroke:var(--select)}
.o-handle[data-dir=nw],.o-handle[data-dir=se]{cursor:nwse-resize}
.o-handle[data-dir=ne],.o-handle[data-dir=sw]{cursor:nesw-resize}
.o-handle[data-dir=n],.o-handle[data-dir=s]{cursor:ns-resize}
.o-handle[data-dir=e],.o-handle[data-dir=w]{cursor:ew-resize}
.o-ep{fill:#fff;stroke:var(--select);cursor:move}
.o-ep.on{fill:var(--select);stroke:#fff}
.o-bend{fill:var(--warn);stroke:#1d2126;cursor:move}
.qc{cursor:crosshair}
.qc circle{fill:transparent}
.qc path{fill:var(--select);stroke:#0d3a55;opacity:.8}
.qc:hover path{opacity:1}
.o-target{fill:rgba(76,194,255,.1);stroke:var(--select)}
.o-port{fill:#fff;stroke:var(--select);pointer-events:none}
.o-port.on{fill:var(--select)}
.o-guide{stroke:var(--hot)}
.o-band{fill:rgba(76,194,255,.1);stroke:var(--select)}
#editor{position:absolute;z-index:6;margin:0;border:1px dashed var(--select);border-radius:2px;background:rgba(76,194,255,.07);resize:none;overflow:hidden;outline:none;font-family:var(--font-scheme);white-space:pre-wrap;overflow-wrap:break-word;caret-color:#0b6ea8;line-height:1.25}
#editor.on-edge{background:#dde2e7;color:#16191c}
.hud{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:4px;padding:4px;border-radius:11px;background:rgba(36,40,45,.88);border:1px solid rgba(0,0,0,.35);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.hud .btn{height:32px;min-width:32px;background:transparent;border-color:transparent;box-shadow:none}
.hud .btn:hover{background:var(--rail-hover)}
#z-reset{min-width:58px;font-variant-numeric:tabular-nums}
.hint{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));right:200px;z-index:5;display:flex;align-items:center;gap:10px;width:fit-content;max-width:calc(100% - 220px);padding:8px 8px 8px 13px;border-radius:11px;background:rgba(36,40,45,.88);border:1px solid rgba(0,0,0,.35);color:var(--ink-dim);font-size:12.5px;line-height:1.4}
.hint b{color:var(--ink);font-weight:500}
.hint .btn{height:26px;min-width:26px;background:transparent;border-color:transparent;box-shadow:none}

/* ---------- properties ---------- */
#props{grid-area:props;background:var(--rail);border-left:1px solid var(--line-deep);overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 28px 16px;min-height:0;min-width:0;z-index:30}
.p-sec{padding:14px 0;border-bottom:1px solid #30353b}
.p-sec:last-child{border-bottom:0}
.p-sec h4{font:700 11px/1 var(--font-brand);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 11px}
.p-lbl{font-size:12px;color:var(--ink-dim);margin:10px 0 6px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.row>label:not(.chk){color:var(--ink-dim);font-size:12px;min-width:64px}
.row.col{flex-direction:column;align-items:stretch;gap:6px}
.sws{display:flex;flex-wrap:wrap;gap:5px}
.sw{appearance:none;width:24px;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);cursor:pointer;padding:0;position:relative;flex:none}
.sw[aria-pressed="true"]{outline:2px solid var(--select);outline-offset:1px}
.sw.none{background:linear-gradient(to top right,transparent 44%,#ff6b6b 44% 56%,transparent 56%),var(--field)}
.sw.custom{background:conic-gradient(#ff6b6b,#ffc53d,#69db7c,#4dabf7,#b197fc,#ff6b6b);overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
select,.num,.txt{height:30px;border-radius:7px;border:1px solid var(--line);background:var(--field);padding:0 8px;font-size:13px;min-width:0}
.num{width:64px;font-variant-numeric:tabular-nums}
.txt{width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{appearance:none;border:0;background:var(--rail-ctl);height:30px;padding:0 10px;cursor:pointer;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--rail-hover)}
.seg button[aria-pressed="true"]{background:var(--select-deep);color:#fff}
.seg svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;vertical-align:-3px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--select);margin:0}
.geo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.geo label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-dim)}
.geo .num{width:100%}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts .btn{font-size:12.5px;padding:0 8px}
.stat{color:var(--ink-dim);font-size:12.5px;margin:10px 0 0;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:12.5px}
.keys dt{color:var(--ink);white-space:nowrap}
.keys dd{margin:0;color:var(--ink-dim)}
kbd{font:600 11px var(--font-ui);padding:1px 5px;border-radius:4px;border:1px solid var(--line);background:var(--field)}

/* ---------- chat ---------- */
#chat{grid-row:2;grid-column:2/4;justify-self:end;width:min(390px,100%);height:100%;min-height:0;display:flex;flex-direction:column;background:#1f2226;border-left:1px solid #101214;box-shadow:-18px 0 40px rgba(0,0,0,.35);z-index:45}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px 16px;border-bottom:1px solid #2d3237}
.chat-head strong{font:700 13px var(--font-brand);letter-spacing:.1em;text-transform:uppercase}
.chat-head .grp{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;background:#2c3136;color:var(--ink-dim);border:1px solid var(--line)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:#6c757d}
.chip.on{color:#c8f7dc;border-color:#2f6b4b}
.chip.on::before{background:#40c983}
#chat-cfg{padding:12px 16px;border-bottom:1px solid #2d3237;background:#23272b}
#chat-cfg label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:6px}
#chat-cfg .hint-t{font-size:12px;color:var(--ink-dim);margin:8px 0;line-height:1.45}
#chat-cfg code{font-size:11.5px;background:var(--field);padding:1px 4px;border-radius:4px}
#chat-log{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:#3a5266;color:#eef6fc;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:#2c3136;border-bottom-left-radius:4px}
.msg.system{align-self:stretch;max-width:none;background:transparent;border:1px dashed #434b53;color:var(--ink-dim);font-size:12.5px}
.msg .m-acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.msg .m-acts .btn{height:28px;font-size:12px;padding:0 9px}
.intro{background:#262a2f;border:1px solid #343a40;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.5;color:var(--ink-dim)}
.intro b{color:var(--ink);font-weight:600}
.intro ol{margin:8px 0 0;padding-left:18px}
#chat-form{display:flex;gap:8px;align-items:flex-end;padding:12px max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) 16px;border-top:1px solid #2d3237}
#chat-input{flex:1;min-height:40px;max-height:140px;resize:none;border-radius:10px;border:1px solid var(--line);background:var(--field);padding:9px 11px;font-size:13.5px;line-height:1.4}
#chat-form .btn{height:40px;min-width:40px}

/* ---------- modal & toast ---------- */
#modal{position:fixed;inset:0;z-index:100;background:rgba(8,10,12,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:min(560px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;background:#262a2f;border:1px solid var(--line);border-radius:14px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.card.wide{width:min(820px,100%)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px 18px}
.card-h h2{margin:0;font:700 14px var(--font-brand);letter-spacing:.1em;text-transform:uppercase}
.card-b{padding:4px 18px 16px;overflow-y:auto;min-height:0}
.card-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px 16px;border-top:1px solid #31363c}
.card-b p{margin:0 0 10px;color:var(--ink-dim);line-height:1.5}
.card textarea{width:100%;min-height:300px;border-radius:9px;border:1px solid var(--line);background:var(--field);padding:10px;font:12.5px/1.45 ui-monospace,"SF Mono",Menlo,Consolas,monospace;resize:vertical}
.list{display:grid;gap:6px;margin:0 0 14px}
.list-h{font:700 11px var(--font-brand);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin:14px 0 8px}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 12px;border-radius:10px;background:#2d3237;border:1px solid #363c43}
.item.cur{border-color:var(--select)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t small{color:var(--ink-dim);font-size:12px}
.item .btn{height:30px;font-size:12.5px}
.empty{color:var(--ink-dim);font-size:13px;padding:6px 2px}
.preview{border-radius:10px;overflow:auto;max-height:52vh;background:repeating-conic-gradient(#2f3439 0 25%,#272b30 0 50%) 0 0/18px 18px;border:1px solid var(--line);display:flex;align-items:flex-start;justify-content:center}
.preview img{display:block;max-width:100%;height:auto}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:120;background:#111417;color:var(--ink);border:1px solid var(--line);padding:9px 14px;border-radius:10px;font-size:13px;pointer-events:none;transition:opacity .18s,transform .18s;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- narrow screens ---------- */
@media (max-width:1080px){#doc-title{width:150px}}
@media (max-width:900px){.hide-t{display:none!important}}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"bar" "stage"}
  #palette,#props{grid-area:stage;width:min(300px,86vw);box-shadow:0 10px 40px rgba(0,0,0,.55);transition:transform .22s ease}
  #palette{justify-self:start;transform:translateX(-105%)}
  #props{justify-self:end;transform:translateX(105%)}
  #app.pal-open #palette,#app.props-open #props{transform:none}
  #chat{grid-column:1/-1;width:100%}
  .only-m{display:inline-flex!important}
  .hide-m{display:none!important}
  .hint{right:auto;max-width:calc(100% - 28px);bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 52px)}
}
@media (max-width:520px){
  #bar{gap:4px}
  .lbl,.brand span{display:none}
  .hide-s{display:none!important}
  .btn-play{padding:0 12px}
}
@media (prefers-reduced-motion:reduce){#palette,#props,#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header id="bar">

<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const FONT = 'Arial, "Liberation Sans", "Helvetica Neue", Helvetica, sans-serif';  // scheme text: same metrics everywhere, also in exports
const GRID = 10;
const MINK = 0.15, MAXK = 4;
const r2 = n => Math.round(n * 100) / 100;
const D = (strs, ...v) => strs.reduce((a, s, i) => a + s + (i < v.length ? r2(v[i]) : ''), '');  // path template with rounded numbers
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
const unit = (v, fb = { x: 1, y: 0 }) => { const l = Math.hypot(v.x, v.y); return l < 1e-9 ? fb : { x: v.x / l, y: v.y / l }; };
const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8);
const plain = s => s.replace(/\u00ad/g, '');                 // labels carry soft hyphens so long words wrap inside the tiles
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
const poly = pts => 'M' + pts.map(p => r2(p[0]) + ' ' + r2(p[1])).join(' L') + ' Z';
const ell = (cx, cy, rx, ry) => D`M${cx - rx} ${cy} A${rx} ${ry} 0 1 1 ${cx + rx} ${cy} A${rx} ${ry} 0 1 1 ${cx - rx} ${cy} Z`;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isNarrow = () => matchMedia('(max-width: 820px)').matches;
const store = {
  get(k, fb) { try { const v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); } catch { return fb; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const K = { docs: 'steel.docs', cur: 'steel.cur', settings: 'steel.settings', chat: 'steel.chat' };

/* ---------- shape library (outlines in local coordinates 0..w, 0..h) ---------- */
const sq = (w, h) => poly([[0, 0], [w, 0], [w, h], [0, h]]);
const SHAPES = {
  text: { name: 'Текст', parts: () => [], defaults: { fill: 'none', stroke: 'none', fontSize: 16, shadow: false, color: '#111417' } },
  rect: { name: 'Прямоугольник', parts: (w, h) => [{ d: sq(w, h), fill: true }] },
  rounded: { name: 'Скруглённый', parts: (w, h) => { const r = Math.min(12, w / 2, h / 2); return [{ d: D`M${r} 0 H${w - r} A${r} ${r} 0 0 1 ${w} ${r} V${h - r} A${r} ${r} 0 0 1 ${w - r} ${h} H${r} A${r} ${r} 0 0 1 0 ${h - r} V${r} A${r} ${r} 0 0 1 ${r} 0 Z`, fill: true }]; } },
  ellipse: { name: 'Эллипс', parts: (w, h) => [{ d: ell(w / 2, h / 2, w / 2, h / 2), fill: true }], text: (w, h) => ({ x: w * .14, y: h * .14, w: w * .72, h: h * .72 }) },
  rhombus: { name: 'Ромб', parts: (w, h) => [{ d: poly([[w / 2, 0], [w, h / 2], [w / 2, h], [0, h / 2]]), fill: true }], text: (w, h) => ({ x: w * .17, y: h * .2, w: w * .66, h: h * .6 }) },
  triangle: { name: 'Треугольник', parts: (w, h) => [{ d: poly([[w / 2, 0], [w, h], [0, h]]), fill: true }], text: (w, h) => ({ x: w * .2, y: h * .42, w: w * .6, h: h * .55 }), ports: (w, h) => ({ top: [w / 2, 0], right: [w * .75, h / 2], bottom: [w / 2, h], left: [w * .25, h / 2] }) },
  hexagon: { name: 'Шестиугольник', parts: (w, h) => { const s = Math.min(w * .22, h * .5); return [{ d: poly([[s, 0], [w - s, 0], [w, h / 2], [w - s, h], [s, h], [0, h / 2]]), fill: true }]; }, text: (w, h) => { const s = Math.min(w * .22, h * .5); return { x: s * .7, y: 0, w: w - s * 1.4, h }; } },
  parallelogram: { name: 'Параллелограмм', parts: (w, h) => { const s = Math.min(w * .2, h * .6); return [{ d: poly([[s, 0], [w, 0], [w - s, h], [0, h]]), fill: true }]; }, text: (w, h) => { const s = Math.min(w * .2, h * .6); return { x: s * .75, y: 0, w: w - s * 1.5, h }; }, ports: (w, h) => { const s = Math.min(w * .2, h * .6); return { top: [w / 2, 0], right: [w - s / 2, h / 2], bottom: [w / 2, h], left: [s / 2, h / 2] }; } },
  trapezoid: { name: 'Трапеция', parts: (w, h) => { const s = Math.min(w * .2, h * .6); return [{ d: poly([[s, 0], [w - s, 0], [w, h], [0, h]]), fill: true }]; }, text: (w, h) => { const s = Math.min(w * .2, h * .6); return { x: s, y: 0, w: w - s * 2, h }; }, ports: (w, h) => { const s = Math.min(w * .2, h * .6); return { top: [w / 2, 0], right: [w - s / 2, h / 2], bottom: [w / 2, h], left: [s / 2, h / 2] }; } },
  cylinder: { name: 'Цилиндр', parts: (w, h) => { const ry = Math.min(12, h * .18); return [{ d: D`M0 ${ry} A${w / 2} ${ry} 0 0 1 ${w} ${ry} V${h - ry} A${w / 2} ${ry} 0 0 1 0 ${h - ry} Z`, fill: true }, { d: D`M0 ${ry} A${w / 2} ${ry} 0 0 0 ${w} ${ry}`, fill: false }]; }, text: (w, h) => { const ry = Math.min(12, h * .18); return { x: 0, y: ry * 2, w, h: h - ry * 3 }; } },
  cloud: { name: 'Облако', parts: (w, h) => { const X = v => v * w, Y = v => v * h; return [{ d: D`M${X(.25)} ${Y(.86)} C${X(.06)} ${Y(.86)} ${X(-.01)} ${Y(.6)} ${X(.15)} ${Y(.5)} C${X(.06)} ${Y(.28)} ${X(.26)} ${Y(.1)} ${X(.42)} ${Y(.22)} C${X(.5)} ${Y(.01)} ${X(.8)} ${Y(.03)} ${X(.81)} ${Y(.26)} C${X(1.01)} ${Y(.27)} ${X(1.03)} ${Y(.56)} ${X(.88)} ${Y(.63)} C${X(.99)} ${Y(.86)} ${X(.76)} ${Y(.98)} ${X(.64)} ${Y(.87)} C${X(.55)} ${Y(1)} ${X(.31)} ${Y(1)} ${X(.25)} ${Y(.86)} Z`, fill: true }]; }, text: (w, h) => ({ x: w * .16, y: h * .24, w: w * .68, h: h * .58 }), ports: (w, h) => ({ top: [w * .6, h * .06], right: [w * .97, h * .45], bottom: [w * .5, h * .96], left: [w * .035, h * .6] }) },
  note: { name: 'Заметка', parts: (w, h) => { const f = Math.min(16, w * .25, h * .3); return [{ d: poly([[0, 0], [w - f, 0], [w, f], [w, h], [0, h]]), fill: true }, { d: D`M${w - f} 0 V${f} H${w}`, fill: false }]; }, defaults: { fill: '#fff1b8' } },
  callout: { name: 'Выноска', parts: (w, h) => { const b = h * .74; return [{ d: poly([[0, 0], [w, 0], [w, b], [w * .46, b], [w * .24, h], [w * .28, b], [0, b]]), fill: true }]; }, text: (w, h) => ({ x: 0, y: 0, w, h: h * .74 }), ports: (w, h) => ({ top: [w / 2, 0], right: [w, h * .37], bottom: [w * .24, h], left: [0, h * .37] }) },
  blockArrow: { name: 'Стрелка-фигура', parts: (w, h) => { const a = Math.min(w * .4, h * .8); return [{ d: poly([[0, h * .25], [w - a, h * .25], [w - a, 0], [w, h / 2], [w - a, h], [w - a, h * .75], [0, h * .75]]), fill: true }]; }, text: (w, h) => { const a = Math.min(w * .4, h * .8); return { x: 0, y: h * .25, w: w - a * .4, h: h * .5 }; }, ports: (w, h) => { const a = Math.min(w * .4, h * .8); return { top: [(w - a) / 2, h * .25], right: [w, h / 2], bottom: [(w - a) / 2, h * .75], left: [0, h / 2] }; } },
  actor: { name: 'Человек', parts: (w, h) => { const r = Math.min(w * .3, h * .13), c = w / 2; return [{ d: ell(c, r, r, r), fill: true }, { d: D`M${c} ${2 * r} V${h * .64} M${w * .06} ${h * .36} H${w * .94} M${c} ${h * .64} L${w * .1} ${h} M${c} ${h * .64} L${w * .9} ${h}`, fill: false }]; }, text: (w, h) => ({ x: -50, y: h + 3, w: w + 100, h: 22 }), valign: 'top', defaults: { shadow: false } },
  terminator: { name: 'Начало / конец', parts: (w, h) => { const r = Math.min(h / 2, w / 2); return [{ d: D`M${r} 0 H${w - r} A${r} ${r} 0 0 1 ${w - r} ${h} H${r} A${r} ${r} 0 0 1 ${r} 0 Z`, fill: true }]; }, text: (w, h) => { const r = Math.min(h / 2, w / 2); return { x: r * .4, y: 0, w: w - r * .8, h }; } },
  predefined: { name: 'Подпрограмма', parts: (w, h) => { const i = Math.min(12, w * .1); return [{ d: sq(w, h), fill: true }, { d: D`M${i} 0 V${h} M${w - i} 0 V${h}`, fill: false }]; }, text: (w, h) => { const i = Math.min(12, w * .1); return { x: i, y: 0, w: w - i * 2, h }; } },
  document: { name: 'Документ', parts: (w, h) => { const a = h * .12; return [{ d: D`M0 0 H${w} V${h - a} Q${w * .75} ${h - a * 2.6} ${w / 2} ${h - a} T0 ${h - a} Z`, fill: true }]; }, text: (w, h) => ({ x: 0, y: 0, w, h: h * .86 }), ports: (w, h) => ({ top: [w / 2, 0], right: [w, h * .44], bottom: [w / 2, h * .88], left: [0, h * .44] }) },

      if (!$('#img-prev')) return;
      if (!pngBlob) throw new Error('blocked');
      prev.innerHTML = `<img alt="Схема «${esc(doc.title)}»" src="${URL.createObjectURL(pngBlob)}">`;
    } catch { if (prev) prev.innerHTML = '<div class="empty" style="padding:24px">PNG не получился в этом браузере. SVG скачивается всегда.</div>'; }
  };
  $('#img-bg').addEventListener('change', make);
  make();
}

/* ---------- chat ---------- */
let chat = [];
const chatLog = $('#chat-log'), chatInput = $('#chat-input');
function chatConnected() { return /^https?:\/\//i.test(settings.chatUrl || ''); }
function renderChat() {
  const on = chatConnected();
  const st = $('#chat-status');
  st.textContent = on ? 'подключён' : 'не подключён';
  st.classList.toggle('on', on);
  $('#chat-url').value = settings.chatUrl || '';
  let h = on
    ? '<div class="intro"><b>Чат подключён к серверу.</b> Пиши, какую схему нарисовать или что поправить. Сервер видит текущую схему и может прислать новую: её можно применить кнопкой под ответом.</div>'
    : '<div class="intro"><b>Чат пока не подключён к ИИ.</b> Когда появится домен и сервер, впиши его адрес в настройках (шестерёнка вверху). А сейчас можно так:<ol><li>напиши здесь, что нарисовать;</li><li>нажми «Скопировать для Claude» под сообщением;</li><li>вставь текст в Claude Code. Claude нарисует схему и положит её в «Готовые схемы».</li></ol></div>';
  h += chat.map((m, i) => {
    let acts = '';
    if (m.role === 'user' && !on) acts = `<div class="m-acts"><button class="btn" data-copy="${i}">Скопировать для Claude</button></div>`;
    if (m.role === 'assistant' && m.diagram) acts = `<div class="m-acts"><button class="btn" data-apply="${i}">Применить схему</button></div>`;
    return `<div class="msg ${m.role}">${esc(m.text)}${acts}</div>`;
  }).join('');
  chatLog.innerHTML = h;
  chatLog.scrollTop = chatLog.scrollHeight;
}
function saveChat() { store.set(K.chat, chat.slice(-200)); }
const forClaude = text => `Запрос из приложения «Стальные схемы»: ${text}\n\nТекущая схема «${doc.title}» (JSON):\n${JSON.stringify(doc)}`;
async function sendChat(text) {
  chat.push({ role: 'user', text, t: Date.now() });
  saveChat(); renderChat();
  if (!chatConnected()) return;
  const wait = document.createElement('div');
  wait.className = 'msg assistant';
  wait.textContent = 'Думаю…';
  chatLog.appendChild(wait);
  chatLog.scrollTop = chatLog.scrollHeight;
  try {
    const r = await fetch(settings.chatUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, history: chat.slice(-20).map(m => ({ role: m.role, text: m.text })), diagram: doc }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    chat.push({ role: 'assistant', text: String(data.reply || 'Готово.'), diagram: data.diagram && typeof data.diagram === 'object' ? data.diagram : undefined, t: Date.now() });
  } catch (err) {
    chat.push({ role: 'system', text: `Сервер не ответил (${err.message || 'ошибка сети'}). Проверь адрес в настройках чата.`, t: Date.now() });
  }
  saveChat(); renderChat();
}
$('#chat-form').addEventListener('submit', e => {
  e.preventDefault();
  const t = chatInput.value.trim();
  if (!t) return;
  chatInput.value = ''; chatInput.style.height = '';
  sendChat(t);
});
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#chat-form').requestSubmit(); } });
chatInput.addEventListener('input', () => { chatInput.style.height = 'auto'; chatInput.style.height = Math.min(140, chatInput.scrollHeight + 2) + 'px'; });
chatLog.addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.copy) {
    const text = forClaude(chat[+b.dataset.copy].text);
    if (await copyText(text)) toast('Скопировано. Вставь это в Claude Code');
    else { modal('Текст для Claude', '<p>Скопируй этот текст и вставь его в Claude Code.</p><textarea id="claude-area" readonly spellcheck="false" aria-label="Текст для Claude"></textarea>', [], true); $('#claude-area').value = text; $('#claude-area').select(); }
  }
  if (b.dataset.apply) {
    const d = chat[+b.dataset.apply].diagram, snap = JSON.stringify(doc);
    doc = normalize(d); sel.clear();
    commitSnap(snap); $('#doc-title').value = doc.title; render(); renderProps(); fit();
    toast('Схема из чата применена. Ctrl+Z вернёт прежнюю');
  }
});
$('#chat-gear').addEventListener('click', () => { const f = $('#chat-cfg'); f.hidden = !f.hidden; $('#chat-gear').setAttribute('aria-expanded', String(!f.hidden)); });
$('#chat-cfg').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#chat-url').value.trim();
  if (v && !/^https?:\/\//i.test(v)) { toast('Адрес должен начинаться с https://'); return; }
  setSetting('chatUrl', v);
  $('#chat-cfg').hidden = true;
  renderChat();
  toast(v ? 'Адрес сохранён' : 'Чат отключён');
});
$('#chat-off').addEventListener('click', () => { setSetting('chatUrl', ''); renderChat(); toast('Чат отключён'); });
$('#chat-clear').addEventListener('click', () => { chat = []; saveChat(); renderChat(); });
function toggleChat(open) {
  const c = $('#chat');
  c.hidden = open === undefined ? !c.hidden : !open;
  $('#b-chat').setAttribute('aria-pressed', String(!c.hidden));
  if (!c.hidden) { closeDrawers(); renderChat(); if (!isNarrow()) chatInput.focus({ preventScroll: true }); }
}
$('#b-chat').addEventListener('click', () => toggleChat());
$('#chat-close').addEventListener('click', () => toggleChat(false));

/* ---------- toolbar ---------- */
function syncToolbar() {
  $('#b-undo').disabled = !hist.length || !!P;
  $('#b-redo').disabled = !fut.length || !!P;
  $('#b-del').disabled = !sel.size || !!P;
  $('#b-grid').setAttribute('aria-pressed', String(!!settings.grid));
  const sb = $('#b-sound');
  sb.setAttribute('aria-pressed', String(!!settings.sound));
  sb.querySelector('.snd-on').style.display = settings.sound ? '' : 'none';
  sb.querySelector('.snd-off').style.display = settings.sound ? 'none' : '';
  $('#speed').value = String(settings.speed);
  const pb = $('#b-play');
  pb.classList.toggle('on', !!P);
  pb.querySelector('.i-play').style.display = P ? 'none' : '';
  pb.querySelector('.i-stop').style.display = P ? '' : 'none';
  pb.querySelector('.lbl').textContent = P ? 'Стоп' : 'Запустить';
  pb.title = P ? 'Остановить анимацию (Esc)' : 'Запустить анимацию паяльником';
}
$('#b-undo').addEventListener('click', undo);
$('#b-redo').addEventListener('click', redo);
$('#b-del').addEventListener('click', deleteSel);
$('#b-grid').addEventListener('click', () => setSetting('grid', !settings.grid));
$('#b-sound').addEventListener('click', () => setSetting('sound', !settings.sound));
$('#speed').addEventListener('change', e => setSetting('speed', e.target.value));
$('#b-play').addEventListener('click', play);
$('#doc-title').addEventListener('change', e => setTitle(e.target.value));
$('#doc-title').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#b-pal').addEventListener('click', () => { const open = !appEl.classList.contains('pal-open'); closeDrawers(); appEl.classList.toggle('pal-open', open); });
$('#b-props').addEventListener('click', () => { const open = !appEl.classList.contains('props-open'); closeDrawers(); appEl.classList.toggle('props-open', open); });
$('#z-in').addEventListener('click', () => zoomAt(1.25, CW / 2, CH / 2));
$('#z-out').addEventListener('click', () => zoomAt(0.8, CW / 2, CH / 2));
$('#z-reset').addEventListener('click', () => zoomAt(1 / view.k, CW / 2, CH / 2));
$('#z-fit').addEventListener('click', fit);
$('#hint-x').addEventListener('click', () => { $('#hint').hidden = true; setSetting('hint', false); });
window.addEventListener('beforeunload', saveNow);

/* ---------- example ---------- */
const EXAMPLE = {
  version: 1,
  title: 'Вход в личный кабинет',
  shapes: [
    { id: 'title', type: 'text', x: 200, y: 10, w: 340, h: 40, text: 'Вход в личный кабинет', fontSize: 22, bold: true },
    { id: 'start', type: 'terminator', x: 300, y: 70, w: 140, h: 50, text: 'Начало', fill: 'chrome' },
    { id: 'input', type: 'parallelogram', x: 280, y: 160, w: 180, h: 64, text: 'Ввод логина\nи пароля' },
    { id: 'check', type: 'rect', x: 290, y: 264, w: 160, h: 60, text: 'Проверка данных\nна сервере' },
    { id: 'db', type: 'cylinder', x: 560, y: 250, w: 110, h: 90, text: 'База\nпользователей', fill: 'plate' },
    { id: 'ok', type: 'rhombus', x: 280, y: 364, w: 180, h: 100, text: 'Данные верны?' },
    { id: 'cabinet', type: 'rect', x: 290, y: 504, w: 160, h: 60, text: 'Открыть\nличный кабинет', fill: '#cdeccd' },
    { id: 'end', type: 'terminator', x: 300, y: 604, w: 140, h: 50, text: 'Конец', fill: 'chrome' },
    { id: 'tries', type: 'rhombus', x: 40, y: 364, w: 170, h: 100, text: 'Попыток\nбольше 3?' },
    { id: 'lock', type: 'rect', x: 45, y: 504, w: 160, h: 60, text: 'Блокировка\nна 5 минут', fill: '#ffd6cc' },
    { id: 'note', type: 'note', x: 560, y: 384, w: 150, h: 70, text: 'Пароль хранится\nв зашифрованном виде' }
  ],
  edges: [
    { id: 'e1', from: 'start', to: 'input' },
    { id: 'e2', from: 'input', to: 'check' },
    { id: 'e3', from: 'check', to: 'ok' },
    { id: 'e4', from: 'ok', to: 'cabinet', label: 'Да' },
    { id: 'e5', from: 'cabinet', to: 'end' },
    { id: 'e6', from: 'ok', to: 'tries', label: 'Нет' },
    { id: 'e7', from: 'tries', to: 'lock', label: 'Да' },
    { id: 'e8', from: 'lock', fromPort: 'bottom', to: 'end', toPort: 'left' },
    { id: 'e9', from: 'tries', fromPort: 'top', to: 'input', toPort: 'left', label: 'Нет' },
    { id: 'e10', from: 'check', to: 'db', route: 'straight', startArrow: 'arrow', dash: 'dash', label: 'запрос' },
    { id: 'e11', from: 'db', to: 'note', route: 'straight', endArrow: 'none', dash: 'dot' }
  ]
};

/* ---------- start ---------- */
function init() {
  const ms = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  ms.setAttribute('width', '0'); ms.setAttribute('height', '0');
  ms.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none';
  measPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  ms.appendChild(measPath);
  document.body.appendChild(ms);
  $('#defs').innerHTML = DEFS;
  steelTile = makeSteel();
  settings = Object.assign({ grid: true, snap: true, sound: true, iron: true, speed: 1, edgePreset: 0, chatUrl: '', hint: true }, store.get(K.settings, {}));
  if (![0.5, 1, 2, 4].includes(settings.speed)) settings.speed = 1;
  chat = store.get(K.chat, []);
  if (!Array.isArray(chat)) chat = [];
  buildPalette();
  const docs = store.get(K.docs, {});
  const saved = store.get(K.cur, null);
  if (saved && docs[saved] && docs[saved].data) { curId = saved; doc = normalize(docs[saved].data); }
  else { curId = uid('d'); doc = normalize(EXAMPLE); }
  $('#doc-title').value = doc.title;
  const hint = $('#hint');
  $('#hint-t').innerHTML = isNarrow()
    ? '<b>«Фигуры»</b> слева вверху · двойной тап пишет текст · <b>▶</b> паяет схему'
    : 'Перетащи фигуру слева · тяни стрелку от <b>синего треугольника</b> · двойной клик пишет текст · <b>Запустить</b> паяет схему';
  hint.hidden = !settings.hint;
  sizeCanvases();
  new ResizeObserver(() => { const had = CW; sizeCanvases(); if (!had) fit(); render(); }).observe(wrapEl);
  fit(); syncToolbar(); renderProps(); renderChat(); render();
  saveNow();
  const want = new URLSearchParams(location.search).get('scheme');
  if (want && /^[\w-]+$/.test(want)) openSiteScheme(want + '.json');
}
init();
})();
</script>
